<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rook</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --line:#e4e2dd; --fg:#1c1b19; --dim:#78736c;
  --accent:#2f6f4f; --warn:#9a6a00; --bad:#a33; --you:#eef3ef;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14150f; --panel:#1b1c16; --line:#2c2e25; --fg:#e8e6df; --dim:#8f8b81;
         --accent:#7fbf95; --warn:#d9a441; --bad:#e07a6a; --you:#1f2a22; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:baseline;gap:1rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1rem;letter-spacing:.02em}
header .meta{color:var(--dim);font-size:.8rem;font-family:var(--mono)}
nav{display:flex;gap:.25rem;padding:0 1.2rem;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
  padding:.6rem .8rem;cursor:pointer;font-size:.9rem}
nav button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding:1.2rem;max-width:1400px}
.grid{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:1rem;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem}
.card h2{margin:0 0 .7rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
ul.list{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto}
ul.list li{padding:.5rem .6rem;border-radius:6px;cursor:pointer;border:1px solid transparent}
ul.list li:hover{background:var(--bg)}
ul.list li[aria-current=true]{border-color:var(--line);background:var(--bg)}
.name{font-weight:600}
.sub{color:var(--dim);font-size:.8rem;font-family:var(--mono)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:var(--dim);font-weight:500;padding:.35rem .5rem;border-bottom:1px solid var(--line)}
td{padding:.35rem .5rem;border-bottom:1px solid var(--line);font-family:var(--mono)}
td.t{font-family:inherit}
.bar{display:inline-block;height:.55rem;background:var(--accent);border-radius:2px;vertical-align:middle}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1.2rem;font-family:var(--mono);font-size:.85rem}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.entry{border-left:2px solid var(--line);padding:.1rem 0 .8rem .8rem;margin-bottom:.4rem}
.entry .hd{font-family:var(--mono);font-size:.78rem;color:var(--dim);display:flex;gap:.7rem;flex-wrap:wrap}
.entry pre,pre.body{margin:.35rem 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);
  font-size:.82rem;max-height:26rem;overflow:auto}
.tag{font-family:var(--mono);font-size:.72rem;padding:.05rem .35rem;border-radius:3px;border:1px solid var(--line)}
.ok{color:var(--accent)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.empty{color:var(--dim);padding:1.5rem 0;text-align:center}
/* The chat stream: one block per thing said, done or asked. */
.stream{min-height:12rem;max-height:62vh;overflow:auto;font-size:.9rem;line-height:1.55;
  display:flex;flex-direction:column;gap:.35rem}
.stream>div{white-space:pre-wrap;word-break:break-word}
.stream .you{background:var(--you);border-radius:8px;padding:.45rem .7rem;align-self:flex-end;max-width:85%}
.stream .md{white-space:normal;padding:.2rem 0}
.stream .md p{margin:.3rem 0}
.stream .md p.h{font-weight:600;margin-top:.7rem}
.stream .md ul{margin:.3rem 0;padding-left:1.4rem}
.stream .md code{font-family:var(--mono);font-size:.85em;background:var(--bg);padding:.05rem .3rem;border-radius:3px}
.stream .md pre.code{margin:.4rem 0;padding:.6rem .8rem;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;overflow:auto;white-space:pre;font-family:var(--mono);font-size:.82rem}
.stream .md pre.code code{background:none;padding:0;font-size:inherit}
.stream .tool{color:var(--accent);font-family:var(--mono);font-size:.82rem}
.stream .think{color:var(--dim);font-style:italic;font-size:.85rem}
.stream .err{color:var(--bad)} .stream .stat{color:var(--dim);font-size:.78rem;font-family:var(--mono)}
.stream .decided,.stream .open{border-left:3px solid var(--line);padding:.3rem .7rem;margin:.2rem 0}
.stream .open{border-left-color:var(--warn)}
form.ask{display:flex;gap:.5rem;margin-top:.8rem}
form.ask input{flex:1;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:.5rem;margin:.5rem 0;align-items:center;flex-wrap:wrap}
.row label{color:var(--dim);font-size:.82rem}
.row select,.row input{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:.2rem .3rem;font:inherit}
.row input{flex:1}
button.quiet{background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;
  font-size:.75rem;padding:.1rem 0}
button.quiet:hover{color:var(--fg)}
.muted{color:var(--dim);font-size:.82rem}
#maintenance-report{white-space:pre-wrap;font-family:var(--mono);margin:0}
form.ask button,.row button,.approve button,.ask-form button{padding:.5rem .9rem;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer;font:inherit}
form.ask button[disabled]{opacity:.5;cursor:default}
.approve{border:1px solid var(--warn);border-radius:6px;padding:.6rem .8rem;margin:.5rem 0;
  display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.approve span{flex:1;font-family:var(--mono);font-size:.82rem}
.approve .preview{flex-basis:100%;margin:0;max-height:16rem;overflow:auto;font-family:var(--mono);
  font-size:.76rem;white-space:pre;background:var(--panel);border-radius:4px;padding:.4rem .6rem}
.ask-form{border:1px solid var(--accent);border-radius:6px;padding:.6rem .8rem;margin:.5rem 0}
.ask-form p{margin:0 0 .4rem;font-family:var(--mono);font-size:.82rem}
.ask-form label{display:block;padding:.15rem 0;cursor:pointer;font-size:.85rem}
.ask-form input[type=text]{width:100%;padding:.4rem;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);color:var(--fg);font:inherit}
.ask-form fieldset{border:0;padding:0;margin:0 0 .7rem}
.scroll{max-height:74vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>rook</h1>
  <span class="meta" id="meta">connecting…</span>
</header>
<nav>
  <button data-tab="chat" aria-selected="true">Chat</button>
  <button data-tab="sessions">Sessions</button>
  <button data-tab="search">Search</button>
  <button data-tab="memory">Memory</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="jobs">Jobs</button>
  <button data-tab="store">Store</button>
</nav>
<main id="view"></main>
<!-- ES modules the browser loads as they are: no bundler, no toolchain (ADR-0012).
     The chat socket is /api/chat. -->
<script type="module" src="/app.js"></script>
</body>
</html>
