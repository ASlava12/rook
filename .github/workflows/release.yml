name: release

# A tag is the trigger and package version. Both binary package versions are
# checked before upload so an archive label cannot hide a different version.
on:
  push:
    tags: ['v*']
  # For a dry run: builds and packages everything and uploads it as workflow
  # artifacts, and publishes nothing. A release worth cutting is one somebody
  # has already downloaded and run.
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing stable tag to rebuild without moving it; publishes nothing'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Release binaries must not require a separately installed VC runtime.
      # --target below keeps this flag out of host-side procedural macros.
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
      PACKAGE_REF: ${{ inputs.source_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl rather than glibc for Linux: a binary that runs on the distro
          # somebody has rather than on the one the runner had. The install
          # script fetches these, and a glibc build refuses to start on
          # anything older than the runner's.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - name: validate rebuild tag
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if [ -n "$SOURCE_TAG" ]; then
            if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'source_tag must name an existing stable vX.Y.Z tag'
              exit 1
            fi
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No cache here on purpose. Two `cross` targets share one `target/`
      # directory for the host-side build scripts, and their containers do not
      # share a glibc: a script built in the newer image and restored into the
      # older one failed with `GLIBC_2.28 not found`, on the second run and not
      # the first, which is what a poisoned cache looks like. A release is built
      # rarely and downloaded by strangers; three minutes of cache is not worth
      # one artefact assembled from something built somewhere else.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross || 'false' }}" = "true" ]; then
            cross build --release --workspace --target ${{ matrix.target }}
          else
            cargo build --release --workspace --target ${{ matrix.target }}
          fi

      - name: verify Windows runtime linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin was not found in the installed MSVC toolchain' }
          foreach ($name in @('rook', 'rookd')) {
            $binary = "target/${{ matrix.target }}/release/$name.exe"
            $dependencies = & $dumpbin /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "cannot inspect $binary" }
            $dependencies
            if (($dependencies -join "`n") -match '(?i)\b(vcruntime[0-9_]*|msvcp[0-9_]*|msvcr[0-9_]*|ucrtbase|api-ms-win-crt-[a-z0-9-]+)\.dll\b') {
              throw "$binary still imports a dynamic C runtime"
            }
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw "$binary cannot run" }
          }

      - name: verify Linux runtime linkage
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          for name in rook rookd; do
            binary="target/${{ matrix.target }}/release/$name"
            headers="$(readelf -l "$binary")"
            dynamic="$(readelf -d "$binary")"
            if [[ "$headers" == *INTERP* || "$dynamic" == *'(NEEDED)'* ]]; then
              echo "$binary still requires a dynamic loader or shared library"
              exit 1
            fi
          done

      # The layout the binaries themselves look for: `share/rook/skills` beside
      # `bin`, which is the second place `builtin_skills_dir` looks. A release
      # without it is an agent with no built-in skills, and nothing in a dev
      # build would ever notice.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          # A tag names the version; a dry run names the commit. Written as an
          # `if` rather than a `&&` chain, because a chain whose test is false
          # returns non-zero and `set -e` ends the step on it — which is the
          # ordinary case here, not the exceptional one.
          if [ "${PACKAGE_REF}" != "${PACKAGE_REF#v}" ]; then
            version="${PACKAGE_REF#v}"
            for package in rook-cli rookd; do
              actual="$(cargo pkgid -p "$package")"
              actual="${actual##*#}"
              actual="${actual##*@}"
              if [ "$actual" != "$version" ]; then
                echo "$package version $actual does not match tag $PACKAGE_REF"
                exit 1
              fi
            done
          else
            version="$(git rev-parse --short HEAD)"
          fi
          name="rook-${version}-${{ matrix.target }}"
          echo "Packaging $(git rev-parse HEAD) as $name"
          mkdir -p "dist/$name/bin" "dist/$name/share/rook"
          from="target/${{ matrix.target }}/release"
          for binary in rook rookd; do
            if [ -f "$from/$binary.exe" ]; then
              cp "$from/$binary.exe" "dist/$name/bin/"
            else
              cp "$from/$binary" "dist/$name/bin/"
            fi
          done
          cp -R skills "dist/$name/share/rook/skills"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          # Rebuilding a tag with a revised recipe keeps both identities:
          # checkout HEAD is the source; GITHUB_SHA identifies this recipe.
          printf 'source_commit=%s\nrecipe_commit=%s\nversion=%s\ntarget=%s\nrustflags=%s\nrustc=%s\nrun_url=%s\n' \
            "$(git rev-parse HEAD)" "$GITHUB_SHA" "$version" "${{ matrix.target }}" \
            "$RUSTFLAGS" "$(rustc --version)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "dist/$name/BUILD-INFO.txt"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # `sha256sum` on Linux and in Git Bash, `shasum` on macOS: the same
          # two columns either way, which is what verifies an install.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$name.sha256"
          else
            shasum -a 256 "$archive" > "$name.sha256"
          fi
          rm -rf "$name"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A dry run builds everything and publishes nothing: the point of it is to
    # find a packaging mistake before a tag exists that has to be deleted.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f -exec mv {} dist/ \;
          # One file with every checksum in it, which is what an install script
          # can verify against without knowing which archive it wants first.
          # `sha256sum` on the Windows runner marks binary mode with a star before
          # the name; one shape of line, so a reader needs to know about one.
          cat dist/*.sha256 | sed 's/ [*]/  /' > SHA256SUMS
          rm dist/*.sha256
          mv SHA256SUMS dist/
          ls -la dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
