name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The Windows gate passed in 43 minutes, then the job expired while saving
    # its build cache. Leave cleanup time without extending the gate's own
    # ceiling: a wedged test still stops at the bounded step below.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: archive verifier regressions
        if: matrix.os == 'ubuntu-latest'
        run: python3 xtask/probes/release-packages/check.py
      - name: model preparation regressions
        if: matrix.os == 'ubuntu-latest'
        run: python3 xtask/probes/model-smoke/check.py
      - name: build native CLI
        shell: bash
        run: cargo build --locked -p rook-cli
      - name: version capture and inherited pipes
        shell: bash
        run: python3 xtask/probes/version-capture/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-version-capture.json"
      - name: owned PATH language-server detection
        shell: bash
        run: python3 xtask/probes/lsp-detection/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-lsp-detection.json"
      - name: workspace admission before language-server probes
        shell: bash
        run: python3 xtask/probes/lsp-workspace-detection/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-lsp-workspace-detection.json"
      - name: exact remote skill-source identity
        shell: bash
        run: python3 xtask/probes/catalog-source-identity/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-catalog-identity.json"
      - name: ACP null and default payloads
        shell: bash
        run: python3 xtask/probes/acp-null/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-acp-null.json"
      - name: credit-limited output recovery
        shell: bash
        run: python3 xtask/probes/credit-output/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-credit-output.json"
      - name: Retry-After HTTP dates
        shell: bash
        run: python3 xtask/probes/retry-after-date/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-retry-after-date.json"
      - name: bounded checker history
        shell: bash
        run: python3 xtask/probes/checker-history/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-checker-history.json"
      - name: concurrent provider retries
        shell: bash
        run: python3 xtask/probes/retry-jitter/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-retry-jitter.json"
      - name: provider wait observations
        shell: bash
        run: |
          cargo build --locked -p rookd
          python3 xtask/probes/provider-wait/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-provider-wait.json"
          python3 xtask/probes/provider-wait/run.py --bin-dir target/debug --refuse auxiliary --output "$RUNNER_TEMP/rook-provider-wait-auxiliary.json"
      - name: diagnostic metadata admission
        shell: bash
        run: |
          rustfmt --edition 2024 --check xtask/probes/diagnostic-metadata/seed.rs
          python3 xtask/probes/diagnostic-metadata/run.py --bin-dir target/debug --build-target target --output "$RUNNER_TEMP/rook-diagnostic-metadata.json"
      - name: release asset body recovery
        shell: bash
        run: python3 xtask/probes/asset-download-recovery/run.py --bin-dir target/debug --tmp-root "$RUNNER_TEMP" --output "$RUNNER_TEMP/rook-asset-download-recovery.json"
      - name: bounded environment probes
        shell: bash
        run: python3 xtask/probes/environment-startup/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-environment-probes.json"
      - name: macOS process-group lifecycle
        if: matrix.os == 'macos-latest'
        run: cargo test --locked -p rook-contain process::tests -- --nocapture
      - run: cargo xtask ci
        timeout-minutes: 45
      - name: independent cache installers
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --locked -p rook-cli
          python3 xtask/probes/install-publication/run.py --bin-dir target/debug --output "$RUNNER_TEMP/rook-install-publication.json"
      - name: compaction comparison admission
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --locked -p rook-core --example compaction-ab
          python3 xtask/probes/compaction-comparison/run.py --binary target/debug/examples/compaction-ab --output "$RUNNER_TEMP/rook-compaction-comparison.json"

      # The Intel slice of macOS has no hosted runner any more, but its SDK is
      # right here on the Apple-silicon one, so it is at least kept compiling.
      - run: rustup target add x86_64-apple-darwin && cargo check --workspace --target x86_64-apple-darwin
        if: matrix.os == 'macos-latest'

      # The install scripts are the first thing a stranger runs and the one
      # thing no test here executes: a syntax slip in either would be found by
      # a user, on the machine where nothing else is installed yet. Parsed on
      # the platform that runs it.
      - run: sh -n install.sh
        if: matrix.os != 'windows-latest'
      - name: parse install.ps1
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          'install.ps1 parses'

  # FreeBSD is a supported target and GitHub offers no runner for it. A real VM
  # is used rather than a cross-compile check, because the two dependencies that
  # carry C code (`zstd-sys` and `ring`) are precisely the ones a cross-check
  # cannot exercise without a sysroot — and they are where "unsupported platform"
  # regressions actually land.
  freebsd:
    name: test freebsd
    runs-on: ubuntu-latest
    # The VM action has hung for hours, and a run that never completes holds
    # every other job's log hostage: GitHub serves none until the whole run
    # is done. The tests take about ten minutes when the VM comes up.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          # Nothing follows this step, so copying the VM's workspace back is
          # `target/` — two and a half gigabytes over ssh that nobody reads, and
          # the one part of this job that has failed on its own.
          copyback: false
          # `git` because the worktree delegation tests drive a real repository,
          # and without it they fail as `No such file or directory` from a
          # process that never started — which reads as a broken feature.
          # Python runs the browser MCP protocol fixtures on Unix.
          prepare: pkg install -y rust git python3
          run: |
            # As the gate does: one run names every failure rather than the
            # first, which on a VM that takes ten minutes to come up is the
            # difference between one round trip and four.
            cargo test --workspace --no-fail-fast

  # Architectures with no hosted runner, but no C sysroot problem either.
  cross:
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `aarch64-unknown-linux-musl` because the release publishes a binary
        # for it: without it here, the tag is the first time that target is
        # ever compiled, and a break in it is found by whoever downloaded it.
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      - run: cross check --workspace --target ${{ matrix.target }}

  # Real turns against a real model: does the agent read the file rather than
  # answer from memory, land the edit it was asked for, use what a command
  # printed, refuse to settle a claim it did not check, hand work to a
  # sub-agent and use what came back, move a file rather than retyping it,
  # write a skill and follow it later, and carry a fact into the next session.
  # A small model on a CPU runner, pulled into a service container, so no key
  # is needed. `xtask/src/smoke.rs` is where they are written down.
  #
  # Not a gate. A model this size is a source of failures that are not ours,
  # and a job that goes red on a coin-flip teaches everyone to stop reading
  # it. Red here is a signal to open, and `continue-on-error` is what keeps
  # it from being a reason to ignore the whole run.
  smoke:
    name: smoke ollama
    runs-on: ubuntu-latest
    continue-on-error: true
    # Sized for the work, not for a hang: eight scenarios against a 3b model on
    # a CPU runner, and every autonomous turn now ends with a goal check, which
    # is a whole extra turn. Runs have taken 16 to 39 minutes.
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
      # The smallest tag with tool calling that gets the four scenarios right
      # more often than not. `cargo xtask smoke --model …` takes any other.
      ROOK_SMOKE_MODEL: ollama/qwen2.5-coder:3b
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pull the model
        # Streaming errors can retain HTTP 200. Validate final success and
        # actual model availability before any smoke scenario is attempted.
        timeout-minutes: 20
        run: bash xtask/probes/model-smoke/prepare.sh http://127.0.0.1:11434 qwen2.5-coder:3b
      - run: cargo xtask smoke

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
