name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci

      # The Intel slice of macOS has no hosted runner any more, but its SDK is
      # right here on the Apple-silicon one, so it is at least kept compiling.
      - run: rustup target add x86_64-apple-darwin && cargo check --workspace --target x86_64-apple-darwin
        if: matrix.os == 'macos-latest'

  # FreeBSD is a supported target and GitHub offers no runner for it. A real VM
  # is used rather than a cross-compile check, because the two dependencies that
  # carry C code (`zstd-sys` and `ring`) are precisely the ones a cross-check
  # cannot exercise without a sysroot — and they are where "unsupported platform"
  # regressions actually land.
  freebsd:
    name: test freebsd
    runs-on: ubuntu-latest
    # The VM action has hung for hours, and a run that never completes holds
    # every other job's log hostage: GitHub serves none until the whole run
    # is done. The tests take about ten minutes when the VM comes up.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          # Nothing follows this step, so copying the VM's workspace back is
          # `target/` — two and a half gigabytes over ssh that nobody reads, and
          # the one part of this job that has failed on its own.
          copyback: false
          prepare: pkg install -y rust
          run: |
            cargo test --workspace

  # Architectures with no hosted runner, but no C sysroot problem either.
  cross:
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      - run: cross check --workspace --target ${{ matrix.target }}

  # Real turns against a real model: does the agent read the file rather than
  # answer from memory, land the edit it was asked for, use what a command
  # printed, and refuse to settle a claim it did not check. A small model on a
  # CPU runner, pulled into a service container, so no key is needed.
  #
  # Not a gate. A model this size is a source of failures that are not ours,
  # and a job that goes red on a coin-flip teaches everyone to stop reading
  # it. Red here is a signal to open, and `continue-on-error` is what keeps
  # it from being a reason to ignore the whole run.
  smoke:
    name: smoke ollama
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
      # The smallest tag with tool calling that gets the four scenarios right
      # more often than not. `cargo xtask smoke --model …` takes any other.
      ROOK_SMOKE_MODEL: ollama/qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pull the model
        # The pull streams progress until it is done; curl returns when it is.
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/pull -d '{"name":"qwen2.5:1.5b"}' | tail -c 200
      - run: cargo xtask smoke

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
