[package]
name = "rook-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
ignore = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "charset", "http2", "gzip"] }
rook-llm.workspace = true
rook-mcp = { version = "0.1.0", path = "../rook-mcp" }
rook-proto.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "process", "fs", "io-util", "time", "macros", "sync"] }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.24.0"
rook-llm.workspace = true
