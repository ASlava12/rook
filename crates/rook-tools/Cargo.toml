[package]
name = "rook-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Not `cfg(windows)` any more, which is what it was while the only thing wanted
# from it was a job object. `printed` is wanted on every platform — it is the
# one place a command's bytes become text — and the crate costs nothing off
# Windows, where it has no dependencies of its own and compiles to almost
# nothing. As a Windows-only dependency it compiled here and broke every other
# platform, which is the failure this line exists to not repeat.
rook-contain = { path = "../rook-contain" }
async-trait = "0.1.92"
ignore = "0.4.33"
globset = "0.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "charset", "http2", "gzip"] }
rook-llm.workspace = true
rook-mcp = { version = "0.3.0", path = "../rook-mcp" }
rook-proto.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "process", "fs", "io-util", "time", "macros", "sync"] }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"
# The askpass helper is a file that has to be somewhere no other user can
# pre-create: a predictable name under /tmp is a symlink waiting to be made.
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.24.0"
rook-llm.workspace = true
