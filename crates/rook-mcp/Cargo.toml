[package]
name = "rook-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream", "charset", "http2"] }
rook-llm.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
