[package]
name = "rookd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rook-core.workspace = true
rook-llm.workspace = true
rook-proto.workspace = true
rook-skills.workspace = true
rook-store.workspace = true
rook-tools.workspace = true
rust-embed = "8.12.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
