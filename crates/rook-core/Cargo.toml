[package]
name = "rook-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
ignore = "0.4.33"
rook-llm.workspace = true
rook-mcp = { version = "0.1.0", path = "../rook-mcp" }
rook-proto.workspace = true
rook-skills.workspace = true
rook-store.workspace = true
rook-tools.workspace = true
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
toml = "1.1.4"
tracing = "0.1.44"
ulid = "3.0.0"

[dev-dependencies]
async-trait = "0.1.92"
rook-llm.workspace = true
rook-skills.workspace = true
rook-store.workspace = true
serde_json = "1.0.151"
tempfile = "3.27.0"
