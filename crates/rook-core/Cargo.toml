[package]
name = "rook-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jsonschema = { version = "0.56.0", default-features = false }
rook-contain = { path = "../rook-contain" }
async-trait = "0.1.92"
futures-util = "0.3.34"
ignore = "0.4.33"
# The installer: fetching a release, checking it against the digest its
# publisher listed, and opening the one archive shape rust-analyzer ships.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "charset", "http2", "gzip", "socks"] }
flate2 = "1.1.9"
sha2 = "0.10.9"
hex = "0.4.3"
rook-llm.workspace = true
rook-lsp = { version = "0.6.0", path = "../rook-lsp" }
rook-mcp = { version = "0.6.0", path = "../rook-mcp" }
rook-proto.workspace = true
rook-skills.workspace = true
rook-store.workspace = true
rook-tools.workspace = true
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.2.0", default-features = false, features = ["text"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-std"] }
toml = "1.1.4"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
async-trait = "0.1.92"
# For a test provider that hands out a few deltas and then an error, which is
# what a dropped connection looks like to the loop.
futures-util = "0.3.34"
rook-llm.workspace = true
rook-skills.workspace = true
rook-store.workspace = true
serde_json = "1.0.151"
tempfile = "3.27.0"
# `test-util` for the paused clock: a test about what a turn does after twenty
# seconds of silence should not take twenty seconds to find out.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
