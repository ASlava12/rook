[package]
name = "rook-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
rook-acp = { version = "0.1.0", path = "../rook-acp" }
rook-core.workspace = true
rook-llm.workspace = true
rook-lsp = { version = "0.1.0", path = "../rook-lsp" }
rook-mcp = { version = "0.1.0", path = "../rook-mcp" }
rook-proto.workspace = true
rook-skills.workspace = true
rook-store.workspace = true
rook-tools.workspace = true
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history", "custom-bindings"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "rook"
path = "src/main.rs"

[dev-dependencies]
libc = "0.2.180"
tempfile = "3.24.0"
