[package]
name = "rook-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
futures-core = "0.3.34"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream", "charset", "http2", "gzip"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"
webpki-roots = "1.0.9"

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
